name: Feature request
description: Something you'd like YTMDesktop+ to do.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe what the app doesn't handle yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: What you'd like it to do. Details are welcome but optional.
    validations:
      required: false
