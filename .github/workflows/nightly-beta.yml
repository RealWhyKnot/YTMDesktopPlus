# Cuts a beta prerelease every night when a shippable commit has landed since
# the last release tag, ignoring the changelog commits releases push back to
# main. The beta is cut from the newest commit on main whose ci run passed.
# The tag is vYYYY.MDD.N-beta for the current UTC date; N starts at 0 and
# increments if the date already has tags. Tags created with the
# workflow token do not trigger tag-push workflows, so this dispatches
# release.yml explicitly.
name: nightly-beta

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-beta
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cut:
    name: tag beta if main moved
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find the newest commit ci passed on
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $passed = @(gh api "repos/$env:REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" --jq '.workflow_runs[].head_sha')
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Could not list ci runs"; exit 1 }
          $sha = git rev-list --max-count=500 HEAD | Where-Object { $passed -contains $_ } | Select-Object -First 1
          if (-not $sha) {
            Write-Output "::warning::No recent commit on main has a passing ci run, skipping"
            exit 0
          }
          git checkout --quiet --detach $sha
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Output "ci passed on $sha; main is at $(git rev-parse origin/main)"
          Write-Output "sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Check for functional changes
        id: gate
        if: steps.candidate.outputs.sha != ''
        uses: RealWhyKnot/workflows/beta-gate@v1
        with:
          tag-glob: 'v20*'
          ignore-paths: |
            .husky/**
            .prettierrc
            .prettierignore
            eslint.config.mjs
            vitest.config.ts
            tsconfig.tests.json
            examples/**
            tools/test-harness/**
      - name: Decide and tag
        id: plan
        if: steps.gate.outputs.has_changes == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = git rev-parse HEAD
          $tagged = @(git tag --points-at $head --list 'v20*')
          if ($tagged.Count -gt 0) {
            Write-Output "$head is already tagged $($tagged -join ', '), skipping"
            Write-Output "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $latestTag = git tag --list 'v20*' --sort=-creatordate | Select-Object -First 1
          if ($latestTag) {
            # Comparing the tag against HEAD is not enough: every release pushes
            # a changelog commit back to main, so main is always ahead of the
            # newest tag by the next run and a beta would be cut every night
            # with nothing in it. Only commits that carry release notes count.
            $subjects = git log --format=%s "$latestTag..HEAD"
            $shippable = @($subjects | Where-Object { $_ -notmatch '\[skip changelog\]' })
            if ($shippable.Count -eq 0) {
              Write-Output "Nothing but changelog bookkeeping since $latestTag, skipping"
              Write-Output "skip=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
            Write-Output "$($shippable.Count) shippable commit(s) since $latestTag"
          }
          $now = [DateTime]::UtcNow
          $minor = $now.Month * 100 + $now.Day
          $prefix = "v$($now.Year).$minor."
          $existing = git tag --list "$prefix*" | ForEach-Object {
            if ($_ -match "^$([regex]::Escape($prefix))(\d+)") { [int]$Matches[1] }
          } | Sort-Object -Descending | Select-Object -First 1
          $n = if ($null -eq $existing) { 0 } else { $existing + 1 }
          $tag = "$prefix$n-beta"
          git tag $tag $head
          git push origin $tag
          Write-Output "Tagged $tag"
          Write-Output "skip=false" >> $env:GITHUB_OUTPUT
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Dispatch release
        if: steps.plan.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh workflow run release.yml -f tag=$env:TAG
