name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automerge:
    uses: RealWhyKnot/workflows/.github/workflows/dependabot-automerge.yml@v1
