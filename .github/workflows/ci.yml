# Continuous integration for pushes and pull requests.
#
# Three layers:
#   checks   - lint, typecheck, formatting, unit tests. Fast, runs on ubuntu.
#   build    - electron-forge make across the release matrix, artifacts kept
#              two weeks. windows arm64 is excluded to match the publish matrix.
#   validate - installs the built flatpak, Squirrel setup, and macOS app, then
#              checks the installed copy actually starts.
# The end-to-end harness (tools/test-harness) needs a display and live network
# and runs from nightly-ytm-canary.yml instead of here.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
      - .gitattributes
      - .editorconfig
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
      - name: Script self-tests
        shell: pwsh
        run: |
          ./scripts/Test-Update-Changelog.ps1
          ./scripts/Test-Generate-ReleaseNotes.ps1
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Formatting
        run: yarn prettier
      - name: Unit tests
        run: yarn test

  build:
    name: build (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            image: ubuntu-latest
            arch: x64
          - os: linux
            image: ubuntu-latest
            arch: arm64
          - os: windows
            image: windows-latest
            arch: x64
          - os: macos
            image: macos-latest
            arch: x64
          - os: macos
            image: macos-latest
            arch: arm64
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
        with:
          cache-electron: "true"
      # The flatpak is built on linux x64 only; cross-arch builds need qemu.
      - name: Cache flatpak runtimes
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-25.08-v1
      - name: Install flatpak toolchain
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build distributables
        run: yarn make --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

  # Install smoke: the built package installs, the installed app stays up, and
  # it creates its user data directory. Log files are not a reliable marker
  # here because stable-version builds keep debug logging off.
  validate:
    name: install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            image: ubuntu-latest
            arch: x64
          - os: windows
            image: windows-latest
            arch: x64
          - os: macos
            image: macos-latest
            arch: arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: dist
      - name: Cache flatpak runtimes
        if: matrix.os == 'linux'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-25.08-v1
      - name: Install and launch the flatpak
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08
          flatpak install --user --noninteractive ./dist/flatpak/x86_64/*.flatpak
          # The maker only installs share/pixmaps, which the xdg icon theme does
          # not search under an exported prefix; a regression there is invisible
          # until someone opens their launcher.
          test -f ~/.local/share/flatpak/exports/share/icons/hicolor/512x512/apps/dev.whyknot.YTMDesktopPlus.png
          test -f ~/.local/share/flatpak/app/dev.whyknot.YTMDesktopPlus/current/active/files/share/metainfo/dev.whyknot.YTMDesktopPlus.metainfo.xml
          dbus-run-session -- xvfb-run -a flatpak run dev.whyknot.YTMDesktopPlus &
          sleep 30
          flatpak ps --columns=application | grep -qx dev.whyknot.YTMDesktopPlus
          [ -n "$(ls -A "$HOME/.var/app/dev.whyknot.YTMDesktopPlus/config/YTMDesktopPlus" 2>/dev/null)" ]
          flatpak kill dev.whyknot.YTMDesktopPlus
      - name: Install and launch the Squirrel setup
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Recurse -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Output "::error::No Setup.exe in the artifact"; exit 1 }
          Start-Process $setup.FullName -ArgumentList "--silent" -Wait
          # Squirrel spawns short-lived event processes and a stub exe that
          # hands off to the real binary, so no single pid is trustworthy.
          # Pass when any installed-copy process has stayed alive for 20s.
          function Get-AppProcesses {
            @(Get-Process ytmdesktop-plus -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:LOCALAPPDATA*" })
          }
          $launched = $false
          $survivor = $null
          $deadline = (Get-Date).AddSeconds(150)
          while (-not $survivor -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            $procs = Get-AppProcesses
            $survivor = $procs | Where-Object { ((Get-Date) - $_.StartTime).TotalSeconds -ge 20 } | Select-Object -First 1
            if (-not $procs -and -not $launched -and (Get-Date) -gt $deadline.AddSeconds(-90)) {
              # Setup did not leave the app running; start the installed copy
              # directly, from app-* rather than the exiting stub.
              $exe = Get-ChildItem "$env:LOCALAPPDATA" -Directory -Filter "ytmdesktop*" | Get-ChildItem -Directory -Filter "app-*" | Get-ChildItem -Filter "ytmdesktop-plus.exe" | Select-Object -First 1
              if (-not $exe) { Write-Output "::error::Setup.exe left no installed copy under LOCALAPPDATA"; exit 1 }
              Write-Output "Auto-launch not detected, starting $($exe.FullName)"
              Start-Process $exe.FullName
              $launched = $true
            }
          }
          if (-not $survivor) {
            Write-Output "::error::No installed app process survived startup"
            Write-Output "Recent app processes:"
            Get-AppProcesses | Format-Table Id, StartTime, Path
            $logs = Get-ChildItem "$env:APPDATA\YTMDesktopPlus\logs" -ErrorAction SilentlyContinue
            foreach ($log in $logs) { Write-Output "--- $($log.Name)"; Get-Content $log.FullName -Tail 50 }
            exit 1
          }
          if (-not (Test-Path "$env:APPDATA\YTMDesktopPlus")) { Write-Output "::error::App never created its user data directory"; exit 1 }
          Get-Process ytmdesktop-plus -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Extract and launch the macOS app
        if: matrix.os == 'macos'
        run: |
          ditto -x -k ./dist/zip/darwin/arm64/*.zip extracted
          app=$(ls -d extracted/*.app | head -1)
          "$app/Contents/MacOS/ytmdesktop-plus" &
          app_pid=$!
          sleep 30
          kill -0 "$app_pid"
          [ -d "$HOME/Library/Application Support/YTMDesktopPlus" ]
          kill "$app_pid"
