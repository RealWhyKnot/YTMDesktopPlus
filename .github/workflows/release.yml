# Builds and publishes a release from a version tag.
#
# Versioning is calendar-based and semver-valid: vYYYY.MDD.N, where the minor
# is month*100+day (2026-08-03 -> 803) and N counts releases that day. Beta
# prereleases append -beta. Four-part dates are deliberately avoided: the
# config store matches migration ranges against the app version with semver
# and a fourth part does not parse.
#
# Flow: validate tag format and package.json version, stamp the version, run
# forge publish per target (publisher-github uploads the installers and the
# Squirrel update feed reads from the release), promote the changelog section,
# attach release notes with a checksum table, and push the changelog commit
# back to main through the signed-commit mutation.
#
# windows arm64 is excluded from the matrix: forge's squirrel maker produces
# colliding artifact names for it (upstream electron/forge issue 1183 era);
# revisit when a windows arm64 user base exists.
name: release

on:
  push:
    tags:
      - "v20*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to re-release
        required: true

concurrency:
  group: changelog-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Resolve and validate
        id: resolve
        shell: pwsh
        env:
          PUSHED_REF: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          $tag = if ($env:EVENT -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:PUSHED_REF }
          if ($tag -notmatch '^v20\d{2}\.([1-9]|1[0-2])\d{2}\.\d+(-beta)?$') {
            Write-Output "::error::Tag '$tag' does not match vYYYY.MDD.N or vYYYY.MDD.N-beta"
            exit 1
          }
          $version = $tag.Substring(1)
          $prerelease = if ($tag.EndsWith('-beta')) { 'true' } else { 'false' }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

  prepare:
    name: create release shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate
    steps:
      # Five platform builds publish into one release. Forge creates the
      # release when it finds none for the tag, so two builds arriving
      # together both create and one dies on already_exists; making the
      # release here first means every build finds it and only uploads.
      - name: Create the release for the tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          gh release view $env:TAG --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:TAG already exists"
            exit 0
          }
          $flags = @("--title", $env:TAG, "--notes", "Build in progress; installers and notes land shortly.", "--verify-tag")
          if ($env:PRERELEASE -eq 'true') { $flags += @("--prerelease", "--latest=false") }
          gh release create $env:TAG --repo $env:REPO @flags
          if ($LASTEXITCODE -ne 0) { exit 1 }

  build:
    name: publish (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    needs: [validate, prepare]
    strategy:
      # One platform's flake should not throw away the other four builds; a
      # failed leg can be re-run on its own.
      fail-fast: false
      matrix:
        include:
          - os: linux
            image: ubuntu-latest
            arch: x64
          - os: linux
            image: ubuntu-latest
            arch: arm64
          - os: windows
            image: windows-latest
            arch: x64
          - os: macos
            image: macos-latest
            arch: x64
          - os: macos
            image: macos-latest
            arch: arm64
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      YTMD_UPDATE_FEED_OWNER: ${{ vars.YTMD_UPDATE_FEED_OWNER }}
      YTMD_UPDATE_FEED_REPOSITORY: ${{ vars.YTMD_UPDATE_FEED_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: ./.github/actions/setup-node-deps
        with:
          cache-electron: "true"
      # The flatpak is built on linux x64 only; cross-arch builds need qemu.
      - name: Cache flatpak runtimes
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-25.08-v1
      - name: Install flatpak toolchain
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Stamp version from tag
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = $env:VERSION
          $package | ConvertTo-Json -Depth 10 | Set-Content package.json
      - name: Build
        run: yarn publish:dry --arch ${{ matrix.arch }}
      - name: Publish to release
        run: yarn publish:fromdry
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Installs the flatpak asset exactly as a user would, from the release,
  # and requires the YTM page to actually load and hook inside the sandbox.
  # Beta and stable releases both run it; the log check relies on debug
  # logging, which packaged builds only write for -beta versions, so the
  # marker wait is skipped for stables and process survival is used instead.
  smoke:
    name: released flatpak smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, build]
    steps:
      - name: Cache flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-25.08-v1
      - name: Install, launch, and check the published bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08
          gh release download "$TAG" --repo "$REPO" --pattern "*.flatpak" --dir bundle
          flatpak install --user --noninteractive ./bundle/*.flatpak
          desktop=~/.local/share/flatpak/exports/share/applications/dev.whyknot.YTMDesktopPlus.desktop
          grep -q "x-scheme-handler/ytmdplus" "$desktop"
          dbus-run-session -- xvfb-run -a flatpak run dev.whyknot.YTMDesktopPlus &
          logfile=~/.var/app/dev.whyknot.YTMDesktopPlus/config/YTMDesktopPlus/logs/main.log
          ok=""
          if [ "$PRERELEASE" = "true" ]; then
            for _ in $(seq 1 24); do
              sleep 5
              if grep -q "YTM view hook failed\|YTM view failed to load" "$logfile" 2>/dev/null; then break; fi
              if grep -q "YTM view loaded" "$logfile" 2>/dev/null; then ok=1; break; fi
            done
            echo "--- main.log tail"
            tail -n 40 "$logfile" || true
          else
            sleep 60
            flatpak ps --columns=application | grep -qx dev.whyknot.YTMDesktopPlus && ok=1
          fi
          flatpak kill dev.whyknot.YTMDesktopPlus || true
          [ -n "$ok" ]

  notes:
    name: changelog + release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, build, smoke]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Script self-tests
        shell: pwsh
        run: |
          ./scripts/Test-Update-Changelog.ps1
          ./scripts/Test-Generate-ReleaseNotes.ps1
      - name: Promote changelog section
        shell: pwsh
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ./scripts/Update-Changelog.ps1 -Mode Promote -Tag $env:TAG -RepositoryUrl "https://github.com/${{ github.repository }}"
      - name: Build grouped commit notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --tags --force --quiet
          # A stable release covers everything since the previous stable; a
          # beta covers everything since the previous tag of any kind. The
          # first release of a kind falls back to full history.
          $all = @(git tag --list 'v20*' --sort=creatordate)
          $candidates = $all
          if ($env:TAG -notmatch '-beta$') {
            $candidates = @($all | Where-Object { $_ -notmatch '-beta$' })
          }
          $position = [array]::IndexOf($all, $env:TAG)
          $previous = ""
          foreach ($candidate in $candidates) {
            if ([array]::IndexOf($all, $candidate) -lt $position) { $previous = $candidate }
          }
          $range = if ($previous) { "$previous..$env:TAG" } else { $env:TAG }
          # Author logins need one API call per commit; 100 commits bounds it.
          $raw = git log --no-merges --max-count=100 --format='%H%x09%s' $range
          $commits = @()
          foreach ($line in $raw) {
            $sha, $subject = $line -split "`t", 2
            if ($subject -match '\[skip changelog\]') { continue }
            $login = gh api "repos/$env:REPO/commits/$sha" --jq '.author.login // ""' 2>$null
            $commits += @{ sha = $sha; subject = $subject; login = "$login" }
          }
          ConvertTo-Json @($commits) | Set-Content commits.json
          $arguments = @{ CommitsPath = "commits.json"; Tag = $env:TAG; Repository = $env:REPO }
          if ($previous) { $arguments.PreviousTag = $previous }
          (./scripts/Generate-ReleaseNotes.ps1 @arguments) -join "`n" | Set-Content whats-changed.md
      - name: Attach release notes with checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          $notes = (Get-Content whats-changed.md -Raw).TrimEnd()
          gh release download $env:TAG --repo $env:REPO --dir assets
          $setup = Get-ChildItem assets -Filter "*.Setup.exe" | Select-Object -First 1
          $install = ""
          if ($setup) {
            $install = "`n`nWindows: download and run [$($setup.Name)](https://github.com/$env:REPO/releases/download/$env:TAG/$($setup.Name)). Installed copies update on their own."
          }
          $bundle = Get-ChildItem assets -Filter "*.flatpak" | Select-Object -First 1
          if ($bundle) {
            $install += "`n`nSteam Deck and other Linux: download [$($bundle.Name)](https://github.com/$env:REPO/releases/download/$env:TAG/$($bundle.Name)), then open it in Discover or run ``flatpak install --user ./$($bundle.Name)``."
          }
          $table = "| Asset | Size | SHA-256 |`n| --- | --- | --- |"
          Get-ChildItem assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $size = "{0:N1} MB" -f ($_.Length / 1MB)
            $table += "`n| $($_.Name) | $size | ``$hash`` |"
          }
          $body = "$notes$install`n`n$table"
          $body | Set-Content notes.md
          $flags = @("--notes-file", "notes.md", "--draft=false")
          if ($env:PRERELEASE -eq 'true') { $flags += @("--prerelease", "--latest=false") }
          gh release edit $env:TAG --repo $env:REPO --verify-tag @flags
      - name: Push promoted changelog to main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $head = git rev-parse HEAD
          $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes("CHANGELOG.md"))
          $request = @{
            query = "mutation(`$input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: `$input) { commit { oid } } }"
            variables = @{
              input = @{
                branch = @{ repositoryNameWithOwner = $env:REPO; branchName = "main" }
                expectedHeadOid = $head
                message = @{ headline = "docs(changelog): promote unreleased to $env:TAG [skip changelog]" }
                fileChanges = @{ additions = @(@{ path = "CHANGELOG.md"; contents = $content }) }
              }
            }
          } | ConvertTo-Json -Depth 12 -Compress
          $result = $request | gh api graphql --input - 2>&1
          if ($LASTEXITCODE -ne 0 -or "$result" -match '"errors"') {
            Write-Output "::error::Changelog promote commit failed: $result"
            exit 1
          }
