# Builds and publishes a release from a version tag.
#
# Versioning is calendar-based and semver-valid: vYYYY.MDD.N, where the minor
# is month*100+day (2026-08-03 -> 803) and N counts releases that day. Beta
# prereleases append -beta. Four-part dates are deliberately avoided: the
# config store matches migration ranges against the app version with semver
# and a fourth part does not parse.
#
# Flow: validate the tag, then build every target and run the checks with a
# read-only token. Only after both pass is the release created and the
# installers uploaded. The Windows update feed files (RELEASES, the nupkg and
# Setup.exe) go up last, once the installed Windows build and every Linux
# package have been launched. Then the release notes are attached and the
# changelog section is promoted on main through the signed-commit mutation.
#
# windows arm64 is excluded from the matrix: forge's squirrel maker produces
# colliding artifact names for it (upstream electron/forge issue 1183 era);
# revisit when a windows arm64 user base exists.
name: release

on:
  push:
    tags:
      - "v20*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to re-release
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Resolve and validate
        id: resolve
        shell: pwsh
        env:
          PUSHED_REF: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          $tag = if ($env:EVENT -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:PUSHED_REF }
          if ($tag -notmatch '^v20\d{2}\.([1-9]|1[0-2])\d{2}\.\d+(-beta)?$') {
            Write-Output "::error::Tag '$tag' does not match vYYYY.MDD.N or vYYYY.MDD.N-beta"
            exit 1
          }
          $version = $tag.Substring(1)
          $prerelease = if ($tag.EndsWith('-beta')) { 'true' } else { 'false' }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

  checks:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Formatting
        run: yarn prettier
      - name: Unit tests
        run: yarn test

  build:
    name: build (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    needs: validate
    strategy:
      # One platform's flake should not throw away the other four builds; a
      # failed leg can be re-run on its own.
      fail-fast: false
      matrix:
        include:
          - os: linux
            image: ubuntu-latest
            arch: x64
          - os: linux
            image: ubuntu-latest
            arch: arm64
          - os: windows
            image: windows-latest
            arch: x64
          - os: macos
            image: macos-latest
            arch: x64
          - os: macos
            image: macos-latest
            arch: arm64
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      YTMD_UPDATE_FEED_OWNER: ${{ vars.YTMD_UPDATE_FEED_OWNER }}
      YTMD_UPDATE_FEED_REPOSITORY: ${{ vars.YTMD_UPDATE_FEED_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
        with:
          cache-electron: "true"
      # The flatpak is built on linux x64 only; cross-arch builds need qemu.
      - name: Cache flatpak runtimes
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-25.08-v1
      - name: Install flatpak toolchain
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Install AppImage toolchain
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
      - name: Stamp version from tag
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = $env:VERSION
          $package | ConvertTo-Json -Depth 10 | Set-Content package.json
          $metainfo = "flatpak/dev.whyknot.YTMDesktopPlus.metainfo.xml"
          $date = Get-Date -Format "yyyy-MM-dd"
          $xml = Get-Content $metainfo -Raw
          $stamped = $xml -replace '<release version="[^"]*" date="[^"]*"/>', "<release version=""$env:VERSION"" date=""$date""/>"
          if ($stamped -eq $xml) { Write-Output "::error::Release stamp did not match in $metainfo"; exit 1 }
          [System.IO.File]::WriteAllText((Resolve-Path $metainfo), $stamped, (New-Object System.Text.UTF8Encoding($false)))
      - name: Load the Windows signing certificate
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if (-not $env:CERTIFICATE) { Write-Output "No signing certificate set, building unsigned"; exit 0 }
          $path = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [System.IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE))
          "WINDOWS_CERTIFICATE_FILE=$path" >> $env:GITHUB_ENV
      - name: Build
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ matrix.os == 'windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: yarn publish:dry --arch ${{ matrix.arch }}
      - name: Check the AppImage runtime matches the target arch
        if: matrix.os == 'linux'
        run: |
          case "${{ matrix.arch }}" in
            arm64) expected=b700 ;;
            *) expected=3e00 ;;
          esac
          image=$(ls out/make/AppImage/${{ matrix.arch }}/*.AppImage)
          actual=$(od -An -tx1 -j 18 -N 2 "$image" | tr -d ' \n')
          echo "$(basename "$image"): e_machine expected=$expected actual=$actual"
          test "$actual" = "$expected"
      - name: Collect the release assets
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem out/publish-dry-run -Recurse -Filter *.forge.publish | ForEach-Object { (Get-Content $_.FullName -Raw | ConvertFrom-Json).artifacts })
          if ($artifacts.Count -eq 0) { Write-Output "::error::No dry-run artifacts to publish"; exit 1 }
          $staging = New-Item -ItemType Directory -Force -Path out/release-assets
          foreach ($artifact in $artifacts) {
            $target = Join-Path $staging.FullName (Split-Path $artifact -Leaf)
            if (Test-Path -LiteralPath $target) { Write-Output "::error::Two artifacts are named $(Split-Path $artifact -Leaf)"; exit 1 }
            Copy-Item -LiteralPath $artifact -Destination $target
          }
          Get-ChildItem $staging.FullName | ForEach-Object { Write-Output "$($_.Name) $($_.Length)" }
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: out/release-assets/
          if-no-files-found: error
          retention-days: 7

  prepare:
    name: create release shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, checks, build]
    permissions:
      contents: write
    steps:
      # Every leg uploads into one release, so it is made once here rather
      # than by whichever upload arrives first.
      - name: Create the release for the tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          gh release view $env:TAG --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:TAG already exists"
            exit 0
          }
          $flags = @("--title", $env:TAG, "--notes", "Build in progress; installers and notes land shortly.", "--verify-tag")
          if ($env:PRERELEASE -eq 'true') { $flags += @("--prerelease", "--latest=false") }
          gh release create $env:TAG --repo $env:REPO @flags
          if ($LASTEXITCODE -ne 0) { exit 1 }

  publish:
    name: publish installers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, prepare]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
      - name: Publish to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $files = @(Get-ChildItem assets -Recurse -File | Where-Object { $_.Name -ne 'RELEASES' -and $_.Extension -ne '.nupkg' -and $_.Name -notlike '*Setup.exe' } | ForEach-Object { $_.FullName })
          ./scripts/Publish-ReleaseAssets.ps1 -Tag $env:TAG -Repository $env:REPO -Paths $files

  windows-smoke:
    name: windows install smoke
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [validate, build]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-windows-x64
          path: assets
      - name: Install, launch, and check the built Setup.exe
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          $setup = Get-ChildItem assets -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Output "::error::No Setup.exe in the build"; exit 1 }
          $releases = Get-Content assets/RELEASES -ErrorAction SilentlyContinue
          if (-not $releases) { Write-Output "::error::No RELEASES in the build"; exit 1 }
          foreach ($line in $releases) {
            $parts = $line.Trim() -split '\s+'
            if ($parts.Count -eq 3 -and -not (Test-Path -LiteralPath (Join-Path assets $parts[1]))) { Write-Output "::error::RELEASES lists $($parts[1]), which the build did not make"; exit 1 }
          }
          Start-Process $setup.FullName -ArgumentList "--silent" -Wait
          $exe = $null
          $deadline = (Get-Date).AddSeconds(120)
          while (-not $exe -and (Get-Date) -lt $deadline) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA\ytmdesktop_plus" -Directory -Filter "app-$env:VERSION*" -ErrorAction SilentlyContinue | Get-ChildItem -Filter "ytmdesktop-plus.exe" | Select-Object -First 1
            if (-not $exe) { Start-Sleep -Seconds 2 }
          }
          if (-not $exe) { Write-Output "::error::Setup.exe did not install app-$env:VERSION under LOCALAPPDATA"; exit 1 }
          Write-Output "Installed $($exe.FullName)"
          Get-Process ytmdesktop-plus -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $userData = Join-Path $env:RUNNER_TEMP "ytmd-smoke-profile"
          $env:YTMD_TEST = "1"
          $env:YTMD_TEST_PROFILE = $userData
          $env:YTMD_TEST_RUNNER_PID = "$PID"
          $app = Start-Process $exe.FullName -ArgumentList "--user-data-dir=$userData" -PassThru
          $logfile = Join-Path $userData "logs\main.log"
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep -Seconds 5
            if ($app.HasExited) { Write-Output "::error::The app exited with code $($app.ExitCode)"; break }
            $log = Get-Content $logfile -Raw -ErrorAction SilentlyContinue
            if ($env:PRERELEASE -eq 'true') {
              if ($log -match "YTM view hook failed|YTM view failed to load") { break }
              if ($log -match "YTM view loaded") { $ok = $true; break }
            } elseif ($i -ge 11) {
              $ok = $true
              break
            }
          }
          if ($ok -and -not (Get-ChildItem $userData -ErrorAction SilentlyContinue)) { Write-Output "::error::The app never wrote its user data directory"; $ok = $false }
          Write-Output "--- main.log tail"
          Get-Content $logfile -Tail 40 -ErrorAction SilentlyContinue
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Process ytmdesktop-plus -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { exit 1 }

  # Installs the flatpak asset exactly as a user would, from the release,
  # and requires the YTM page to actually load and hook inside the sandbox.
  # Beta and stable releases both run it; the log check relies on debug
  # logging, which packaged builds only write for -beta versions, so the
  # marker wait is skipped for stables and process survival is used instead.
  smoke:
    name: released linux smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [validate, publish]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache flatpak runtimes
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-25.08-v1
      - name: Install, launch, and check the published bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08
          gh release download "$TAG" --repo "$REPO" --pattern "*.flatpak" --dir bundle
          flatpak install --user --noninteractive ./bundle/*.flatpak
          desktop=~/.local/share/flatpak/exports/share/applications/dev.whyknot.YTMDesktopPlus.desktop
          grep -q "x-scheme-handler/ytmdplus" "$desktop"
          # The maker only installs share/pixmaps, which the xdg icon theme does
          # not search under an exported prefix; a regression there is invisible
          # until someone opens their launcher.
          test -f ~/.local/share/flatpak/exports/share/icons/hicolor/512x512/apps/dev.whyknot.YTMDesktopPlus.png
          test -f ~/.local/share/flatpak/app/dev.whyknot.YTMDesktopPlus/current/active/files/share/metainfo/dev.whyknot.YTMDesktopPlus.metainfo.xml
          dbus-run-session -- xvfb-run -a flatpak run dev.whyknot.YTMDesktopPlus &
          logfile=~/.var/app/dev.whyknot.YTMDesktopPlus/config/YTMDesktopPlus/logs/main.log
          ok=""
          if [ "$PRERELEASE" = "true" ]; then
            for _ in $(seq 1 24); do
              sleep 5
              if grep -q "YTM view hook failed\|YTM view failed to load" "$logfile" 2>/dev/null; then break; fi
              if grep -q "YTM view loaded" "$logfile" 2>/dev/null; then ok=1; break; fi
            done
            echo "--- main.log tail"
            tail -n 40 "$logfile" || true
          else
            sleep 60
            flatpak ps --columns=application | grep -qx dev.whyknot.YTMDesktopPlus && ok=1
          fi
          flatpak kill dev.whyknot.YTMDesktopPlus || true
          [ -n "$ok" ]
      - name: Install, launch, and check the published AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb apparmor-utils
          echo "apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"
          sudo cp packaging/apparmor/ytmdesktop-plus /etc/apparmor.d/ytmdesktop-plus
          sudo apparmor_parser -r /etc/apparmor.d/ytmdesktop-plus
          gh release download "$TAG" --repo "$REPO" --pattern "*-x86_64.AppImage" --dir appimage
          image=$(ls appimage/*.AppImage)
          sudo install -D -m 755 "$image" /opt/YTMDesktopPlus/YTMDesktopPlus.AppImage
          dbus-run-session -- xvfb-run -a /opt/YTMDesktopPlus/YTMDesktopPlus.AppImage --appimage-extract-and-run &
          logfile=~/.config/YTMDesktopPlus/logs/main.log
          ok=""
          if [ "$PRERELEASE" = "true" ]; then
            for _ in $(seq 1 24); do
              sleep 5
              if grep -q "YTM view hook failed\|YTM view failed to load" "$logfile" 2>/dev/null; then break; fi
              if grep -q "YTM view loaded" "$logfile" 2>/dev/null; then ok=1; break; fi
            done
            echo "--- main.log tail"
            tail -n 40 "$logfile" || true
          else
            sleep 60
            pgrep -f "appimage_extracted_.*ytmdesktop-plus" > /dev/null && ok=1
          fi
          pkill -f "appimage_extracted_.*ytmdesktop-plus" || true
          [ -n "$ok" ]

  package-smoke:
    name: released ${{ matrix.format }} smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            arch: x64
            image: ubuntu-latest
            pattern: "*_amd64.deb"
            container: ubuntu:24.04
          - format: rpm
            arch: x64
            image: ubuntu-latest
            pattern: "*.x86_64.rpm"
            container: fedora:latest
          - format: deb
            arch: arm64
            image: ubuntu-24.04-arm
            pattern: "*_arm64.deb"
            container: ubuntu:24.04
          - format: rpm
            arch: arm64
            image: ubuntu-24.04-arm
            pattern: "*.arm64.rpm"
            container: fedora:latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install, launch, and check the published package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          REPO: ${{ github.repository }}
          PATTERN: ${{ matrix.pattern }}
          CONTAINER: ${{ matrix.container }}
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern "$PATTERN" --dir package
          bash packaging/smoke/linux-package.sh "$(ls package/*)" "$CONTAINER"

  publish-windows:
    name: publish windows update feed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, publish, windows-smoke, smoke, package-smoke]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-windows-x64
          path: assets
      - name: Publish Setup.exe, the nupkg and RELEASES
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $packages = @(Get-ChildItem assets -File | Where-Object { $_.Extension -eq '.nupkg' -or $_.Name -like '*Setup.exe' } | ForEach-Object { $_.FullName })
          if ($packages.Count -eq 0) { Write-Output "::error::No Windows installer in the build"; exit 1 }
          ./scripts/Publish-ReleaseAssets.ps1 -Tag $env:TAG -Repository $env:REPO -Paths $packages
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/Publish-ReleaseAssets.ps1 -Tag $env:TAG -Repository $env:REPO -Paths @((Resolve-Path assets/RELEASES).Path)

  notes:
    name: changelog + release notes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, publish-windows]
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Script self-tests
        shell: pwsh
        run: |
          ./scripts/Test-Update-Changelog.ps1
          ./scripts/Test-Generate-ReleaseNotes.ps1
      - name: Build grouped commit notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --tags --force --quiet
          # A stable release covers everything since the previous stable; a
          # beta covers everything since the previous tag of any kind. The
          # first release of a kind falls back to full history.
          $all = @(git tag --list 'v20*' --sort=creatordate)
          $candidates = $all
          if ($env:TAG -notmatch '-beta$') {
            $candidates = @($all | Where-Object { $_ -notmatch '-beta$' })
          }
          $position = [array]::IndexOf($all, $env:TAG)
          $previous = ""
          foreach ($candidate in $candidates) {
            if ([array]::IndexOf($all, $candidate) -lt $position) { $previous = $candidate }
          }
          $range = if ($previous) { "$previous..$env:TAG" } else { $env:TAG }
          # Author logins need one API call per commit; 100 commits bounds it.
          $raw = git log --no-merges --max-count=100 --format='%H%x09%s' $range
          $commits = @()
          foreach ($line in $raw) {
            $sha, $subject = $line -split "`t", 2
            if ($subject -match '\[skip changelog\]') { continue }
            $login = gh api "repos/$env:REPO/commits/$sha" --jq '.author.login // ""' 2>$null
            $commits += @{ sha = $sha; subject = $subject; login = "$login" }
          }
          ConvertTo-Json @($commits) | Set-Content commits.json
          $arguments = @{ CommitsPath = "commits.json"; Tag = $env:TAG; Repository = $env:REPO }
          if ($previous) { $arguments.PreviousTag = $previous }
          (./scripts/Generate-ReleaseNotes.ps1 @arguments) -join "`n" | Set-Content whats-changed.md
      - name: Attach release notes with checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          $notes = (Get-Content whats-changed.md -Raw).TrimEnd()
          gh release download $env:TAG --repo $env:REPO --dir assets
          $setup = Get-ChildItem assets -Filter "*.Setup.exe" | Select-Object -First 1
          $install = ""
          if ($setup) {
            $install = "`n`nWindows: download and run [$($setup.Name)](https://github.com/$env:REPO/releases/download/$env:TAG/$($setup.Name)). Installed copies update on their own."
          }
          $bundle = Get-ChildItem assets -Filter "*.flatpak" | Select-Object -First 1
          if ($bundle) {
            $install += "`n`nSteam Deck and other Linux: download [$($bundle.Name)](https://github.com/$env:REPO/releases/download/$env:TAG/$($bundle.Name)), then open it in Discover or run ``flatpak install --user ./$($bundle.Name)``."
          }
          $image = Get-ChildItem assets -Filter "*-x86_64.AppImage" | Select-Object -First 1
          if ($image) {
            $install += "`n`nAny other Linux, no install: download [$($image.Name)](https://github.com/$env:REPO/releases/download/$env:TAG/$($image.Name)), mark it executable and run it. On Ubuntu 24.04 and Debian 13 you will also need the AppArmor profile, see the README."
          }
          $table = "| Asset | Size | SHA-256 |`n| --- | --- | --- |"
          Get-ChildItem assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $size = "{0:N1} MB" -f ($_.Length / 1MB)
            $table += "`n| $($_.Name) | $size | ``$hash`` |"
          }
          $body = "$notes$install`n`n$table"
          $body | Set-Content notes.md
          $flags = @("--notes-file", "notes.md", "--draft=false")
          if ($env:PRERELEASE -eq 'true') { $flags += @("--prerelease", "--latest=false") }
          gh release edit $env:TAG --repo $env:REPO --verify-tag @flags
      - name: Promote the changelog on main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $deadline = (Get-Date).AddMinutes(5)
            do {
              $busy = gh run list --repo $env:REPO --workflow changelog-append.yml --limit 20 --json status --jq 'map(select(.status != "completed")) | length'
              if ("$busy".Trim() -eq "0") { break }
              Write-Output "Waiting for $busy changelog-append run(s) to finish"
              Start-Sleep -Seconds 15
            } while ((Get-Date) -lt $deadline)
            git fetch --quiet origin main
            git checkout --quiet --force --detach origin/main
            $head = git rev-parse HEAD
            ./scripts/Update-Changelog.ps1 -Mode Promote -Tag $env:TAG -RepositoryUrl "https://github.com/$env:REPO" -KeepRange "$env:TAG..HEAD"
            git diff --quiet -- CHANGELOG.md
            if ($LASTEXITCODE -eq 0) {
              Write-Output "CHANGELOG.md on main already has $env:TAG"
              exit 0
            }
            $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes("CHANGELOG.md"))
            $request = @{
              query = "mutation(`$input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: `$input) { commit { oid } } }"
              variables = @{
                input = @{
                  branch = @{ repositoryNameWithOwner = $env:REPO; branchName = "main" }
                  expectedHeadOid = $head
                  message = @{ headline = "docs(changelog): promote unreleased to $env:TAG [skip changelog]" }
                  fileChanges = @{ additions = @(@{ path = "CHANGELOG.md"; contents = $content }) }
                }
              }
            } | ConvertTo-Json -Depth 12 -Compress
            $result = $request | gh api graphql --input - 2>&1
            if ($LASTEXITCODE -eq 0 -and "$result" -notmatch '"errors"') {
              Write-Output "Promoted $env:TAG on main"
              exit 0
            }
            Write-Output "::warning::Attempt $attempt of 5 to commit the changelog failed: $result"
            git checkout --quiet -- CHANGELOG.md
            Start-Sleep -Seconds (10 * $attempt)
          }
          Write-Output "::error::Changelog promote commit failed"
          exit 1
