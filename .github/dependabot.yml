# Weekly dependency updates, grouped to keep the PR count sane. Versions are
# offered once they are three days old, matching npmMinimalAgeGate in
# .yarnrc.yml. Patch-level updates to npm dev dependencies are auto-merged by
# dependabot-automerge.yml once CI passes.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
    groups:
      electron-forge:
        patterns:
          - "@electron-forge/*"
      eslint:
        patterns:
          - "eslint*"
          - "typescript-eslint"
          - "vue-eslint-parser"
    ignore:
      # Vite is pinned to 5.x until electron-forge's vite plugin supports
      # newer majors in a stable release.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    target-branch: "main"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
